<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connected — The Overexplained Publisher</title><link rel="stylesheet" href="stile.css"></head><body><main>
<h1 id="t">Connecting…</h1><p id="m"></p><div class="box" id="c" style="display:none"></div>
<script>
const q=new URLSearchParams(location.search);
if(q.get('code')){document.getElementById('t').textContent='TikTok account authorized';
document.getElementById('m').textContent='Authorization code (valid for a few minutes, single use):';
const c=document.getElementById('c');c.style.display='block';c.textContent=q.get('code');}
else{document.getElementById('t').textContent='Not authorized';
document.getElementById('m').textContent=(q.get('error')||'')+' '+(q.get('error_description')||'');}
</script></main></body></html>
